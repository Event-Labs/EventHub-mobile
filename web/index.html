<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="EventHub - Nền tảng quản lý và bán vé sự kiện hàng đầu">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EventHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EventHub</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #070D1E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: #FFFFFF;
    }
    #splash-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center 40%, #0F1D38 0%, #070D1E 80%);
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      animation: splashAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .logo-glow {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 20px;
    }
    .logo-glow::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.4) 0%, rgba(99, 102, 241, 0.2) 50%, transparent 70%);
      filter: blur(12px);
      animation: pulseGlow 2.4s ease-in-out infinite alternate;
    }
    .logo-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #38BDF8 0%, #818CF8 50%, #C084FC 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: 0.3px;
      margin-bottom: 28px;
    }
    .progress-bar-container {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -40%;
      width: 40%;
      background: linear-gradient(90deg, #06B6D4, #3B82F6, #8B5CF6);
      border-radius: 999px;
      animation: progressSlide 1.5s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes progressSlide {
      0% { left: -40%; width: 30%; }
      50% { left: 40%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
    @keyframes splashAppear {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-container">
      <div class="logo-glow">
        <img class="logo-img" src="icons/Icon-192.png" alt="EventHub" />
      </div>
      <div class="brand-title">EventHub</div>
      <div class="brand-subtitle">Nền tảng sự kiện hàng đầu</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // Seamless transition from HTML Splash to Flutter Canvas
    function hideHtmlSplash() {
      var splash = document.getElementById('splash-screen');
      if (splash && splash.style.display !== 'none') {
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }

    window.addEventListener('flutter-first-frame', hideHtmlSplash);

    // Fallback safeguard in case flutter-first-frame event is missed
    window.addEventListener('load', function() {
      setTimeout(function() {
        var flutterView = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
        if (flutterView) {
          hideHtmlSplash();
        }
      }, 3500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
